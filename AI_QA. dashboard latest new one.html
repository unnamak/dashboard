<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A&amp;I Quality Engineering</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --brand:#DD0033; --paper:#F7F3F2; --panel:#FFFFFF; --ink:#241417; --muted:#7A656A; --line:#E7DCDD;
    --run:#A31232; --grow:#E8752A; --transform:#7B2A6B; --alert:#DD0033;
    --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
       font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:1360px;margin:0 auto;padding:22px 22px 60px;width:100%}
  header.top{display:grid;grid-template-columns:1fr auto;gap:14px 20px;align-items:end;
    background:var(--brand);color:#fff;border-radius:2px;padding:20px 22px;margin-bottom:14px}
  .daysbar{grid-column:1 / -1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    border-top:1px solid rgba(255,255,255,.28);padding-top:12px;margin-top:2px}
  .daysbar label{font-size:13px;font-weight:600;color:#fff}
  .daysbar input{font:inherit;font-size:14px;font-weight:600;width:74px;padding:6px 9px;border:0;border-radius:2px;
    background:#fff;color:var(--ink);text-align:center}
  .dayshint{font-size:12px;color:rgba(255,255,255,.8)}
  h1{font-size:26px;line-height:1.1;font-weight:650;letter-spacing:-.02em;margin:0}
  .sub{color:rgba(255,255,255,.88);margin-top:6px;max-width:66ch}
  .loadbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn.ghost{font:inherit;font-weight:500;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);
             border-radius:2px;padding:9px 15px;cursor:pointer}
  .icon{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;background:#fff;
        border:1px solid #fff;border-radius:2px;padding:8px 12px;cursor:pointer;color:var(--brand);font-weight:600}
  .icon:hover{background:rgba(255,255,255,.88)}
  .icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .drop{border:1px dashed rgba(255,255,255,.7);border-radius:2px;padding:9px 14px;background:transparent;color:#fff;cursor:pointer}
  .drop.hot{border-color:#fff;background:rgba(255,255,255,.16)}
  .btn.ghost:focus-visible,.chip:focus-visible,.vtab:focus-visible,th:focus-visible,.icon:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .source{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:2px;margin-bottom:14px}
  .source div{padding:9px 16px;border-right:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .source div:last-child{border-right:0}
  .source b{color:var(--ink);font-weight:600}
  .warnrow{color:var(--alert)}
  .views{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:2px;margin-bottom:14px}
  .vtab{flex:1;font:inherit;font-size:14.5px;font-weight:600;background:transparent;border:0;border-right:1px solid var(--line);
        padding:13px 18px;cursor:pointer;color:var(--muted)}
  .vtab:last-child{border-right:0}
  .vtab .n{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
  .vtab[aria-pressed="true"]{background:var(--brand);color:#fff}
  .vtab[aria-pressed="true"] .n{color:rgba(255,255,255,.85)}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
  .main{min-width:0}
  .side{position:sticky;top:14px;min-width:0}
  .filters{background:var(--panel);border:1px solid var(--line);border-radius:2px}
  .frow{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
  .frow:last-child{border-bottom:0}
  .frow .lab{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
  .frow .chipset{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--ink);
        border-radius:2px;padding:3px 10px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
  .clearall{margin-left:auto;font-size:12.5px;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline}
  .ledger{display:grid;background:var(--panel);border:1px solid var(--line);border-radius:2px;margin-bottom:14px}
  .cellk{padding:13px 16px;border-right:1px solid var(--line)}
  .cellk:last-child{border-right:0}
  .cellk .k{font-size:12.5px;color:var(--muted)}
  .cellk .v{font-size:25px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
  .cellk .v small{font-size:14px;font-weight:500;color:var(--muted)}
  .cellk .d{font-size:12px;color:var(--muted);margin-top:2px}
  .neg{color:var(--alert)}
  .grid{display:grid;gap:14px;margin-bottom:14px}
  .g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  .g11{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px 16px 16px;margin-bottom:14px;min-width:0}
  .panel h2{font-size:14.5px;font-weight:650;margin:0 0 2px}
  .panel .note{font-size:12.5px;color:var(--muted);margin:0 0 12px;max-width:80ch}
  .infer{font-size:12px;color:var(--brand);border-left:2px solid var(--brand);padding-left:9px;margin:10px 0 0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:right;font-weight:600;color:var(--muted);font-size:12.5px;padding:6px 8px;
     border-bottom:1px solid var(--ink);cursor:pointer;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
  td.wrap{white-space:normal;text-align:left;line-height:1.6}
  tbody tr:hover{background:#FBF4F5}
  tbody tr.on{background:#FBE4EA}
  tr[data-pick]{cursor:pointer}
  .mix{display:inline-flex;width:120px;height:10px;border-radius:1px;overflow:hidden;background:#F0E9EA;vertical-align:middle}
  .mix i{display:block;height:100%}
  .mixwrap{display:inline-flex;flex-direction:column;gap:3px;vertical-align:middle}
  .mixlegend{display:flex;gap:9px;font-size:10.5px;color:var(--muted)}
  .mixlegend b{font-weight:700}
  .tag{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:3px;border:1px solid;white-space:nowrap}
  .taglist{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
  .applist{display:flex;flex-direction:column;gap:3px}
  .sqcards{display:flex;flex-direction:column;gap:0}
  .sqcard{display:grid;grid-template-columns:minmax(200px,1.3fr) minmax(160px,1.4fr) minmax(200px,1.6fr) minmax(150px,1fr);
          gap:18px;padding:14px 4px;border-bottom:1px solid var(--line);align-items:start}
  .sqcard:last-child{border-bottom:0}
  .sqcard.on{background:#FBE4EA}
  .pgrid{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start;padding:6px 0 4px}
  .pstat{min-width:90px}
  .pbig{font-size:24px;font-weight:650;letter-spacing:-.02em}
  .pval{font-size:14px;font-weight:500;margin-top:2px}
  .sqcard .field{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
  .sqcard .sqname{font-size:14px;font-weight:650;color:var(--ink);cursor:pointer}
  .sqcard .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .sqcard .applist div{font-size:13px;padding:1px 0}
  table.applistt{width:100%;border-collapse:collapse;font-size:13px}
  table.applistt td{padding:2px 0;border:0;text-align:left;white-space:nowrap;vertical-align:top}
  table.applistt td.an{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:14px}
  .sqcard .rtgwrap{padding-top:2px}
  @media (max-width:760px){.sqcard{grid-template-columns:1fr;gap:10px}}
  table.colfix{table-layout:fixed}
  table.colfix th{white-space:normal;vertical-align:bottom;line-height:1.25}
  table.colfix td{overflow:hidden;text-overflow:ellipsis}
  table.colfix td.wrap{overflow:visible;text-overflow:clip;white-space:normal}
  .t-Run{color:var(--run);border-color:#E9C0CC;background:#FBEFF2}
  .t-Grow{color:#B4551A;border-color:#F0CFB4;background:#FDF3EA}
  .t-Transform{color:var(--transform);border-color:#DCC4D8;background:#F7EFF6}
  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .ax{font-size:11px;fill:var(--muted)}
  .vlab{font-size:11px;fill:var(--ink)}
  footer{color:var(--muted);font-size:12.5px;margin-top:18px}
  @media (max-width:1100px){.g23,.g11{grid-template-columns:1fr}}
  @media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}}
  @media (max-width:620px){.ledger{grid-template-columns:repeat(2,1fr)!important}}
</style>
</head>
<body>
<div class="wrap" id="page">

<header class="top">
  <div>
    <h1>A&amp;I Quality Engineering</h1>
  </div>
  <div class="loadbox">
    <label class="drop" id="drop">Drop 1–3 Excel files
      <input id="file" type="file" accept=".xlsx,.xlsm,.csv" multiple hidden></label>
    <button class="icon" id="png"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>Download image</button>
    <button class="btn ghost" id="reset" onclick="doReset()">Clear &amp; reset</button>
  </div>
  <div class="daysbar">
    <label for="workdays">Working days in period</label>
    <input id="workdays" type="number" min="1" max="366" step="1" value="21">
    <span class="dayshint">person-days = resources × allocation × working days. Month ≈ 21 · Quarter ≈ 65 · Year ≈ 260</span>
  </div>
</header>

<div class="views" id="views"></div>

<div class="layout">
  <div class="main">
    <div class="ledger" id="ledger"></div>
    <div id="body"></div>
  </div>
  <aside class="side">
    <div class="filters" id="filters"></div>
  </aside>
</div>

<footer id="foot"></footer>
</div>

const RTGS=["Run","Grow","Transform"];

const $=s=>document.querySelector(s);
const num=v=>{const n=typeof v==="number"?v:parseFloat(String(v??"").replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0;};
const pct=v=>{const n=num(v);return n>1.5?n/100:n;}; // accepts 45 or 0.45
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(n,d=0)=>n===null||!isFinite(n)?"—":n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});

const toObjs=t=>t.rows.map(r=>Object.fromEntries(t.cols.map((c,i)=>[c,r[i]])));

const isLiveRelease=st=>{const s=norm(st);return s.includes("complete")||s.includes("inprogress")||s.includes("progress");};
let workDays=21;                                  // person-days = FTE-share x workDays
const HOURS_PER_DAY=8;                             // 1 person-day = 8 hours
// capacity in person-days = (sum of resource allocations) × working days in the period.
// The allocation sum is resources × their allocation %, taken straight from Team_Allocation.
const pdays=alloc=>alloc*workDays;
const pd=(alloc,d=0)=>fmt(pdays(alloc),d);

/* block-aware forward fill: carries a value down only within the run started by `anchorCol` */
function blockFill(rows,anchorCol,cols){
  let cur={};
  return rows.map(r=>{
    const out={...r};
    const starting = r[anchorCol]!==null && r[anchorCol]!==undefined && String(r[anchorCol]).trim()!=="";
    cols.forEach(c=>{
      const v=out[c];
      const has = v!==null && v!==undefined && String(v).trim()!=="";
      if(starting){ cur[c]=has?v:null; }
      else if(has){ cur[c]=v; }
      else{ out[c]=cur[c]??null; }
    });
    return out;
  });
}

function ffill(rows,col){ let cur=null; return rows.map(r=>{const out={...r};
  const v=out[col]; const has=v!==null&&v!==undefined&&String(v).trim()!=="";
  if(has)cur=v; else out[col]=cur; return out; }); }

function build(){

  bu=RAW.BU_Squads.map((_,i)=>({squad:buFilledSquad[i]["Squads"],buName:buFilledAttrs[i]["Business Unit"],

  const computed=new Map();
  bu.forEach(r=>{
    if(!r.category||!isFinite(r.assign))return;
    if(!computed.has(r.squad))computed.set(r.squad,new Map());
    const m=computed.get(r.squad); m.set(r.category,(m.get(r.category)||0)+r.assign);
  });
  new Set(bu.map(r=>r.squad)).forEach(sq=>{
    const sup=suppliedBySquad.get(sq);
    if(sup && sup.size){ squadRTG.set(sq,new Map(sup)); }        // supplied wins
    else if(computed.get(sq)){ squadRTG.set(sq,computed.get(sq)); } // else compute
  });

  extract=extractRaw.map(r=>({
    qbu:String(r.BusinessUnit??"").trim(), cat:String(r["Release Category"]??"").trim(),
    workitem:String(r["Work Item Description"]??""), month:String(r["Release Month"]??"").trim(),
    status:String(r.Status??"").trim(), total:num(r["Total TC"]), exec:num(r["Executed TC Count"]),
    defects:num(r["Total No. of Defects Reported"]), passPct:num(r["Pass %"])
  }));

  // QMetry Release Category -> RTG. Incident/Regression = Run, Enhancement/Change Request = Grow, Project = Transform.
  // "contains" matching so variants like "Salesforce Regression" or "Adhoc Regression" still resolve.
  function catToRTG(cat){
    const c=norm(cat);
    if(!c)return null;
    if(c.includes("incident"))return "Run";
    if(c.includes("regression"))return "Run";
    if(c.includes("changerequest")||c.includes("change"))return "Grow";
    if(c.includes("enhancement"))return "Grow";
    if(c.includes("project"))return "Transform";
    return null;
  }
  // Some QMetry business units aren't in BU_Squads and shouldn't be categorised one by one.
  // Fan their releases out across real business units by a fixed weighting.
  // Key is matched loosely (norm), weights should sum to 1.
  const BU_FANOUT={
    "integrationservices": [["Advisory",0.90],["Fiduciary Services",0.05],["Shared Platforms",0.05]]
  };


  // ATL rule (hard-coded): BU_Squads uses combined business-unit values ATL-Wills / ATL-Trust / ATL-Estates.
  // Each maps to one or more QMetry business units:
  //   ATL-Wills   -> QMetry Wills
  //   ATL-Trust   -> QMetry Trust AND Trust Replatforming
  //   ATL-Estates -> QMetry Estates
  // Map is keyed by QMetry BU (normalised) -> the BU_Squads business-unit label it belongs to.
  const ATL_QMETRY_TO_BU={
    "wills":             "ATL-Wills",
    "trust":             "ATL-Trust",
    "trustreplatforming":"ATL-Trust",
    "estates":           "ATL-Estates"
  };
  // only apply for ATL-* business units that actually exist in BU_Squads
  const atlBUsPresent=new Set(bu.map(b=>b.buName).filter(n=>/^atl-/i.test(n)).map(norm));
  const qmetryToAtlBU=new Map();
  Object.entries(ATL_QMETRY_TO_BU).forEach(([q,label])=>{
    if(atlBUsPresent.has(norm(label))) qmetryToAtlBU.set(q,label);
  });

  unmatchedScope=[]; unmatchedBU=[];
  const expanded=[];
  extract.forEach(e=>{
    e.inferredRTG=catToRTG(e.cat);
    if(!e.inferredRTG)unmatchedScope.push(e.cat);
    const fan=BU_FANOUT[norm(e.qbu)];
    const atlBU=qmetryToAtlBU.get(norm(e.qbu));
    if(fan){
      fan.forEach(([targetBU,w])=>{
        expanded.push(Object.assign({},e,{qbu:targetBU,weight:(e.weight||1)*w,fannedFrom:e.qbu,buMatched:true}));
      });
    } else if(atlBU){
      // QMetry release resolves to a combined ATL-* business unit
      expanded.push(Object.assign({},e,{qbu:atlBU,qmetrySource:e.qbu,weight:e.weight||1,buMatched:true}));
    } else {
      const buHit=[...new Set(bu.map(b=>b.buName))].some(n=>norm(n)===norm(e.qbu))||
                  [...new Set(bu.map(b=>b.sub))].some(n=>norm(n)===norm(e.qbu));
      e.buMatched=buHit; e.weight=e.weight||1;
      if(!buHit)unmatchedBU.push(e.qbu);
      expanded.push(e);
    }
  });
  extract=expanded;
  unmatchedScope=[...new Set(unmatchedScope)]; unmatchedBU=[...new Set(unmatchedBU)];
  const buSquadNames=new Set(bu.map(b=>norm(b.squad)));
  unmatchedSquads=[...new Set(team.map(t=>t.squad).filter(sq=>sq&&!buSquadNames.has(norm(sq))))];
}
let extract=[];
function ecagg(list){
  const a={n:list.length,total:0,exec:0,defects:0,passW:0};
  list.forEach(r=>{a.total+=r.total;a.exec+=r.exec;a.defects+=r.defects;a.passW+=r.passPct*r.exec;});
  a.execPct=a.total?100*a.exec/a.total:null;
  a.pass=a.exec?a.passW/a.exec:null;
  a.density=a.exec?100*a.defects/a.exec:null;
  return a;
}

/* -------------------------------------------------- filtering */
const F={bu:new Set(),sub:new Set(),squad:new Set(),rtg:new Set(),funding:new Set(),name:new Set()};
let view="bu", sortK=null, sortD=-1, selectedPerson=null;

// A&I is a capacity-only business unit: it maps resources but must not appear in BU-level delivery views.
function isDeliveryBU(name){ return norm(name)!=="ai"; }
function buFiltered(){
  return bu.filter(r=>(!F.bu.size||F.bu.has(r.buName))&&(!F.sub.size||F.sub.has(r.sub))&&
                       (!F.squad.size||F.squad.has(r.squad))&&(!F.rtg.size||F.rtg.has(r.category)));
}
// a squad now spans a SET of BUs (one per application row). Build lookups once.
function squadBUs(sq){ return [...new Set(bu.filter(b=>b.squad===sq).map(b=>b.buName).filter(Boolean))]; }
function squadSubs(sq){ return [...new Set(bu.filter(b=>b.squad===sq).map(b=>b.sub).filter(Boolean))]; }
function teamFiltered(){
  return team.filter(r=>(!F.squad.size||F.squad.has(r.squad))&&(!F.funding.size||F.funding.has(r.funding))&&
                         (!F.name.size||F.name.has(r.name))&&
                         (!F.bu.size||squadBUs(r.squad).some(b=>F.bu.has(b)))&&
                         (!F.sub.size||squadSubs(r.squad).some(sb=>F.sub.has(sb))));
}
// a person's capacity split across RTG, using the squad's Assignment%-derived mix
function personRTG(t){
  const mix=squadRTG.get(t.squad); const out=new Map();
  if(!mix||!mix.size){ out.set("Unclassified",t.alloc); return out; }
  const tot=[...mix.values()].reduce((a,b)=>a+b,0)||1;
  mix.forEach((v,k)=>out.set(k,(v/tot)*t.alloc));
  return out;
}
function capacityByRTG(teamRows){
  const out=new Map();
  teamRows.forEach(t=>{ personRTG(t).forEach((v,k)=>out.set(k,(out.get(k)||0)+v)); });
  return out;
}

function renderViews(){
  const c=k=>({bu:new Set(bu.map(r=>r.buName).filter(isDeliveryBU)).size+" business units",
               people:new Set(team.map(t=>t.name)).size+" people",

function renderFilters(){

  const subVals=[...new Set(bu.map(r=>r.sub))].filter(Boolean).sort();

  $("#filters").innerHTML=(any?`<div class="frow" style="flex-direction:row;justify-content:flex-end;padding:8px 14px">

    defs.map(([lab,key,vals])=>
    `<div class="frow"><span class="lab">${lab}</span><div class="chipset">`+
    vals.map(v=>`<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${F[key].has(v)}">${esc(v)}</button>`).join("")+
    `</div></div>`).join("");
  $("#filters").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,v=b.dataset.v;F[k].has(v)?F[k].delete(v):F[k].add(v);render();});
  if($("#clear"))$("#clear").onclick=()=>{Object.values(F).forEach(s=>s.clear());render();};
}
function mixBar(m,t){
  const parts=RTGS.map(r=>{const v=m.get(r)||0,w=t?100*v/t:0;return {r,w};}).filter(p=>p.w>0);
  const bar=`<span class="mix">`+parts.map(p=>`<i style="width:${p.w}%;background:${COL[p.r]}"></i>`).join("")+`</span>`;
  const legend=`<span class="mixlegend">`+parts.map(p=>`<span><b style="color:${COL[p.r]}">${p.r.slice(0,1)}</b> ${p.w.toFixed(0)}%</span>`).join("")+`</span>`;
  return `<span class="mixwrap">${bar}${legend}</span>`;
}

/* -------------------------------------------------- render shell */
function render(){
  renderViews(); renderFilters();
  const empty = (!bu||!bu.length) && (!team||!team.length) && (!extract||!extract.length);

  if(view==="bu")renderBU(); else if(view==="people")renderPeople(); else renderRTG();
}

/* -------------------------------------------------- TAB 2: people */
function personDetail(){
  if(!selectedPerson)return "";
  const rs=team.filter(t=>t.name===selectedPerson);
  if(!rs.length)return "";
  const totalCap=rs.reduce((a,b)=>a+b.alloc,0);
  const funding=[...new Set(rs.map(r=>r.funding))].join(", ");
  const contractType=[...new Set(rs.map(r=>r.contract).filter(Boolean))].join(", ");

  // per squad: pull the BU_Squads rows for that squad
  const squadBlocks=rs.map(r=>{
    const bs=bu.filter(b=>b.squad===r.squad);
    const matched=bs.length>0;
    const buName=matched?[...new Set(bs.map(x=>x.buName).filter(Boolean))].join(", "):"Not in BU_Squads";
    const sub=matched?[...new Set(bs.map(x=>x.sub).filter(Boolean))].join(", "):"—";
    // per-application assignment %, from BU_Squads. Keep app order; sum if an app repeats.
    const appMap=new Map();
    bs.forEach(b=>{ if(!b.app)return;
      if(!appMap.has(b.app))appMap.set(b.app,{app:b.app,assign:0,group:b.group||"",cat:b.category||""});
      appMap.get(b.app).assign += (isFinite(b.assign)?b.assign:0);
    });
    const apps=[...appMap.values()];
    const groups=[...new Set(bs.map(b=>b.group).filter(Boolean))];
    const mix=squadRTG.get(r.squad)||new Map();
    const mtot=[...mix.values()].reduce((a,b)=>a+b,0)||1;
    return {squad:r.squad,alloc:r.alloc,funding:r.funding,buName,sub,apps,groups,mix,mtot,matched};
  });
  const unmatchedCap=squadBlocks.filter(b=>!b.matched).reduce((a,b)=>a+b.alloc,0);

  // person-level rollups across all their squads
  const allBUs=[...new Set(squadBlocks.filter(b=>b.matched).map(b=>b.buName))];
  // effective application footprint: squad assignment% weighted by the person's allocation to that squad
  const effApp=new Map();
  squadBlocks.filter(b=>b.matched).forEach(b=>{
    b.apps.forEach(a=>{
      const eff=a.assign*b.alloc; // share of the PERSON's time on this app via this squad
      effApp.set(a.app,(effApp.get(a.app)||0)+eff);
    });
  });
  const allApps=[...effApp.entries()].sort((x,y)=>y[1]-x[1]);
  const allGroups=[...new Set(squadBlocks.flatMap(b=>b.groups))];
  const persMix=new Map(); rs.forEach(r=>personRTG(r).forEach((v,k)=>persMix.set(k,(persMix.get(k)||0)+v)));
  const pmtot=[...persMix.values()].reduce((a,b)=>a+b,0)||1;

  return `<section class="panel" id="personDetail" style="border-color:var(--brand)">
    <div class="phead"><div>
      <h2>${esc(selectedPerson)}</h2>
      <p class="note">Everything the model holds for this person — their allocation from Team_Allocation, joined through squad into BU_Squads.</p>
    </div><button class="clearall" id="clearPerson" style="margin:0">Close</button></div>

    <div class="pgrid">
      <div class="pstat"><div class="field">Total capacity</div><div class="pbig">${(100*totalCap).toFixed(0)}%</div></div>
      <div class="pstat"><div class="field">Squads</div><div class="pbig">${rs.length}</div></div>
      <div class="pstat"><div class="field">Funding</div><div class="pval">${esc(funding)}</div></div>
      <div class="pstat"><div class="field">Contract type</div><div class="pval">${esc(contractType)||"—"}</div></div>
      <div class="pstat"><div class="field">Business units</div><div class="pval">${esc(allBUs.join(", "))}</div></div>
    </div>

    <div class="field" style="margin:16px 0 8px">Allocation across squads</div>
    <div class="sqcards">${squadBlocks.map(b=> b.matched
      ? `<div class="sqcard">
      <div><div class="sqname">${esc(b.squad)}</div>
        <div class="meta">${esc(b.buName)} · ${esc(b.sub)} · ${esc(b.funding)}</div>
        <div class="meta" style="color:var(--brand);font-weight:600;margin-top:4px">${(100*b.alloc).toFixed(0)}% of their time</div>
        <div class="rtgwrap">${mixBar(b.mix,b.mtot)}</div></div>
      <div><div class="field">Applications · assignment %</div>
        ${b.apps.length?`<table class="applistt"><tbody>${b.apps.map(a=>`<tr><td>${esc(a.app)}</td><td class="an">${(a.assign*100).toFixed(0)}%</td></tr>`).join("")}</tbody></table>`:"—"}</div>
      <div><div class="field">Group applications</div>
        <span class="taglist">${b.groups.map(g=>`<span class="tag t-Transform">${esc(g)}</span>`).join("")||"—"}</span></div>
      <div></div>
    </div>`
      : `<div class="sqcard">
      <div><div class="sqname">${esc(b.squad)}</div>
        <div class="meta" style="color:var(--brand);font-weight:600;margin-top:4px">${(100*b.alloc).toFixed(0)}% of their time</div></div>
      <div></div><div></div><div></div>
    </div>`).join("")}</div>

    <div class="field" style="margin:16px 0 8px">Application footprint — share of this person's time, assignment % weighted by their allocation to each squad</div>
    <span class="applist" style="flex-direction:row;flex-wrap:wrap;gap:8px">${allApps.length?allApps.map(([app,eff])=>`<span class="tag" style="border-color:var(--line)">${esc(app)} · ${(eff*100).toFixed(0)}%</span>`).join(""):"—"}</span>

    ${(()=>{
      const monthlyHrs=totalCap*workDays*HOURS_PER_DAY;    // this person's total hours for the period
      // hours by RTG: split the MATCHED capacity by its supplied RTG mix; unmatched capacity shown separately
      const matchedCap=squadBlocks.filter(b=>b.matched).reduce((a,b)=>a+b.alloc,0);
      const rtgHrs=new Map();
      RTGS.forEach(k=>{ if(persMix.get(k)) rtgHrs.set(k,(persMix.get(k)/pmtot)*matchedCap*workDays*HOURS_PER_DAY); });
      const otherHrs=unmatchedCap*workDays*HOURS_PER_DAY;   // e.g. QA Other Work
      const otherSquads=squadBlocks.filter(b=>!b.matched).map(b=>b.squad).join(", ");
      // hours by application: effApp is share of the person's time; times monthly hours
      const appHrs=allApps.map(([app,eff])=>[app,eff*workDays*HOURS_PER_DAY]);
      const fmtH=h=>h.toFixed(0);
      return `
      <div class="field" style="margin:18px 0 6px">Hours this period · ${fmtH(monthlyHrs)} h total (${workDays} days × ${HOURS_PER_DAY} h × ${(100*totalCap).toFixed(0)}%)</div>
      <div class="grid g11" style="margin:0">
        <div>
          <div class="meta" style="margin-bottom:5px">By Run / Grow / Transform</div>

/* -------------------------------------------------- TAB 3: RTG */
function renderRTG(){
  const B=buFiltered(), T=teamFiltered();
  const cap=capacityByRTG(T); const tot=[...cap.values()].reduce((a,b)=>a+b,0)||1;
  // Business units visible after the sidebar filters. Releases are matched on BU name.
  const visibleBUs=new Set(B.map(r=>norm(r.buName)));
  const inFilter=e=>e.buMatched && visibleBUs.has(norm(e.qbu));
  const scoped=extract.filter(inFilter);
  const RW=e=>e.weight||1;                       // release weight (fan-out gives fractions)
  const relByRTG=new Map(); scoped.forEach(e=>{ if(e.inferredRTG) relByRTG.set(e.inferredRTG,(relByRTG.get(e.inferredRTG)||0)+RW(e)); });
  const relTot=scoped.filter(e=>e.inferredRTG).reduce((a,e)=>a+RW(e),0)||1;
  const scopedTotal=scoped.reduce((a,e)=>a+RW(e),0);
  $("#ledger").style.gridTemplateColumns="repeat(3,1fr)";
  $("#ledger").innerHTML=RTGS.map(r=>`<div class="cellk"><div class="k">${r} releases</div><div class="v">${fmt(relByRTG.get(r)||0)}</div><div class="d">${(100*(relByRTG.get(r)||0)/relTot).toFixed(0)}% of releases</div></div>`).join("")
;

  // release-category rows with their RTG mapping (counts only)
  const inScope=extract.filter(inFilter);
  const excluded=extract.filter(e=>!e.buMatched).reduce((a,e)=>a+RW(e),0);
  const cats=[...new Set(inScope.map(e=>e.cat).filter(Boolean))];
  const catRows=cats.map(cat=>{
    const cy=inScope.filter(e=>e.cat===cat);
    const rtg=cy[0].inferredRTG;
    const releases=cy.reduce((a,c)=>a+RW(c),0);
    return {cat,rtg,releases};
  }).sort((a,b)=>b.releases-a.releases);

  // rollup by RTG (release counts only)

  $("#body").innerHTML=`
    <div class="grid g23">

        <table class="colfix"><thead><tr>
          <th style="width:56%">Release category</th><th style="width:22%">RTG</th><th style="width:22%">Releases</th>
        </tr></thead><tbody>
        ${catRows.map(r=>`<tr><td class="wrap">${esc(r.cat)}</td>
          <td>${r.rtg?`<span class="tag t-${esc(r.rtg)}">${esc(r.rtg)}</span>`:'<span class="tag" style="color:var(--alert);border-color:#E9B7BE">unmapped</span>'}</td>
          <td>${fmt(r.releases)}</td></tr>`).join("")}
        </tbody></table>

        <table><thead><tr><th>RTG</th><th>Releases</th></tr></thead><tbody>
        ${RTGS.filter(r=>byRTGcyc.get(r)).map(r=>`<tr><td><span class="tag t-${r}">${r}</span></td>
          <td>${fmt(byRTGcyc.get(r)||0)}</td></tr>`).join("")}
        </tbody></table>
        <div class="field" style="margin:16px 0 6px">Team capacity by RTG, for comparison</div>
        <table><thead><tr><th>RTG</th><th>Person-days</th><th>Share</th></tr></thead><tbody>
        ${(()=>{const cap=capacityByRTG(T);const tot=[...cap.values()].reduce((a,b)=>a+b,0)||1;
          return RTGS.filter(r=>cap.get(r)).map(r=>`<tr><td><span class="tag t-${r}">${r}</span></td>
            <td>${pd(cap.get(r)||0)}</td><td>${(100*(cap.get(r)||0)/tot).toFixed(0)}%</td></tr>`).join("");})()}
        </tbody></table>

    </div>
    <section class="panel">
      <h2>Business unit by RTG — releases delivered</h2>
      <div style="overflow-x:auto"><table class="colfix"><thead><tr>
        <th style="width:22%">Business unit</th><th style="width:13%">Run</th><th style="width:13%">Grow</th><th style="width:13%">Transform</th><th style="width:15%">Total releases</th><th style="width:24%">Mix</th>
      </tr></thead><tbody>
      ${[...new Set(B.map(r=>r.buName))].filter(isDeliveryBU).map(name=>{
        const cy=extract.filter(e=>e.buMatched&&norm(e.qbu)===norm(name));
        const m=new Map(); cy.forEach(e=>{if(e.inferredRTG)m.set(e.inferredRTG,(m.get(e.inferredRTG)||0)+(e.weight||1));});
        const mtot=[...m.values()].reduce((a,b)=>a+b,0)||1;

      return `<section class="panel">

          return `<tr><td class="wrap">${esc(b)}</td><td class="wrap">${esc(srcs)}</td>
            ${RTGS.map(r=>`<td>${fmt(m.get(r)||0)}</td>`).join("")}<td>${fmt(tot)}</td></tr>`;
        }).join("")}

    })()}
    <section class="panel">
      <h2>Team capacity by squad, split by RTG</h2>

  const list=RTGS.map(r=>[r,new Map([...new Set(B.map(b=>b.squad))].map(sq=>{
      const rs=T.filter(t=>t.squad===sq); const m=capacityByRTG(rs); return [sq,m.get(r)||0];
    }))]);
  const squads=[...new Set(B.map(b=>b.squad))];
  const W=740,L=200,R=90,rowH=30,H=squads.length*rowH+16;
  const totals=squads.map(sq=>{const m=capacityByRTG(T.filter(t=>t.squad===sq));return [...m.values()].reduce((a,b)=>a+b,0);});
  const max=Math.max(...totals,0.01);
  let g=""; squads.forEach((sq,i)=>{
    const y=i*rowH+6; let x=L; const w=(W-L-R)*(totals[i]/max);
    g+=`<text class="vlab" x="${L-8}" y="${y+16}" text-anchor="end">${esc(sq.length>28?sq.slice(0,26)+"…":sq)}</text>`;
    RTGS.forEach(r=>{const m=capacityByRTG(T.filter(t=>t.squad===sq)); const v=m.get(r)||0; if(!v)return;
      const seg=totals[i]?w*(v/totals[i]):0;
      g+=`<rect x="${x}" y="${y+3}" width="${seg}" height="17" fill="${COL[r]}"><title>${esc(sq)} · ${r} ${pd(v)} person-days</title></rect>`;x+=seg;});
    g+=`<text class="ax" x="${x+8}" y="${y+17}">${pd(totals[i])}</text>`;
  });
  $("#rtgBySquad").innerHTML=squads.length?`<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>

    RTGS.map(r=>`<span><span style="display:inline-block;width:9px;height:9px;background:${COL[r]};margin-right:5px"></span>${r}</span>`).join("")+`</div>`
    :`<p class="note">Nothing in the current selection.</p>`;
}

/* -------------------------------------------------- file loading */
const norm2=norm;
function classify(cols){
  const nc=cols.map(norm2);
  const has=k=>nc.includes(norm2(k));
  if(has("Squads")||(has("A&I Applications")&&has("Assignment %")))return "BU_Squads";
  if(has("Team Member Name")&&has("Capacity Allocation %"))return "Team_Allocation";
  if(has("Scope of Work")&&has("RTG"))return "Scope_of_Work";
  if(nc.includes(norm2("Total TC")))return "extract";
  return null;
}
function ingest(wb,fname){
  const found=[];
  wb.SheetNames.forEach(n=>{
    const objs=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:null,raw:true});
    if(!objs.length)return;
    const role=classify(Object.keys(objs[0]));
    if(!role)return;
    if(role==="extract"){extractRaw=objs;sources.extract=`${fname} · ${n} · ${objs.length} cycles`;}
    else{RAW[role]=objs;sources.model=fname;}
    found.push(`${n} → ${role}`);
  });
  return found;
}
function handleFiles(files){
  Promise.all([...files].map(f=>f.arrayBuffer().then(b=>{
    const wb=XLSX.read(new Uint8Array(b),{type:"array",cellDates:false});
    const found=ingest(wb,f.name);
    return found.length?null:`${f.name}: no recognised sheet (need BU_Squads, Team_Allocation, Scope_of_Work headers, or a QMetry extract with Total TC)`;
  }))).then(msgs=>{
    Object.values(F).forEach(s=>s.clear()); build(); render();
    const bad=msgs.filter(Boolean); if(bad.length)alert(bad.join("\n"));
  }).catch(e=>alert("Could not read that file: "+e.message));
}
$("#file").onchange=e=>handleFiles(e.target.files);
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$("#drop").classList.add("hot");}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev==="drop"||e.target===document.body)$("#drop").classList.remove("hot");}));
document.addEventListener("drop",e=>{if(e.dataTransfer.files.length)handleFiles(e.dataTransfer.files);});
$("#png").onclick=async()=>{
  const btn=$("#png"), was=btn.innerHTML;
  if(typeof html2canvas!=="function"){alert("Image library did not load. Use print to PDF instead.");return;}
  btn.disabled=true;btn.textContent="Rendering…";
  try{
    const canvas=await html2canvas($("#page"),{backgroundColor:"#F7F3F2",scale:2,useCORS:true,
      ignoreElements:el=>el.id==="png"||el.id==="reset"||el.id==="drop"});
    const name=`qa-estate-${view}.png`;
    const blob=await new Promise(res=>canvas.toBlob(res,"image/png"));
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url;a.download=name;a.rel="noopener";
    document.body.appendChild(a);a.click();a.remove();
    const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent||"");
    if(mobile&&navigator.canShare){const file=new File([blob],name,{type:"image/png"});
      if(navigator.canShare({files:[file]}))navigator.share({files:[file],title:"A&I QA estate view"}).catch(()=>{});}
    setTimeout(()=>URL.revokeObjectURL(url),8000);
  }catch(e){alert("Could not render the image: "+e.message);}
  finally{btn.disabled=false;btn.innerHTML=was;}
};

(function(){const w=document.querySelector("#workdays"); if(w)w.oninput=()=>{
  const v=parseInt(w.value,10); if(isFinite(v)&&v>0){workDays=v; render();}
};})();

document.addEventListener("click",e=>{

window.doReset=function(){
  // wipe ALL loaded data -> blank slate, ready for a fresh upload
  RAW={BU_Squads:[],Team_Allocation:[],Scope_of_Work:[]};
  extractRaw=[];
  sources={model:"none loaded",extract:"none loaded"};
  Object.values(F).forEach(set=>set.clear());
  selectedPerson=null;
  view="bu";
  const wd=document.querySelector("#workdays"); if(wd){wd.value=21; workDays=21;}
  build(); render();
  if(window.scrollTo)window.scrollTo({top:0,behavior:"smooth"});
  const btn=document.querySelector("#reset");
  if(btn){const was=btn.textContent; btn.textContent="Cleared ✓"; setTimeout(()=>{btn.textContent=was;},1400);}
};
